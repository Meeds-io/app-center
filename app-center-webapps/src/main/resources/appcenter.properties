spring.liquibase.change-log=classpath:db.changelogs/app-center-changelog-1.0.0.xml
meeds.cache.app-center.application.ttl=-1
meeds.cache.app-center.application.max=1000

# Badge counts are derived, never stored. The TTL bounds staleness for a source
# whose changes the platform cannot observe, self-heals a missed eviction, and
# bounds how long a cluster node that missed one serves a stale value.
# Value in seconds; read once at cache creation.
meeds.cache.app-center.badge.ttl=300
# Sized as concurrent users x badged applications
meeds.cache.app-center.badge.max=5000
