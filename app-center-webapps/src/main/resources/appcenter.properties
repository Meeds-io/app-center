spring.liquibase.change-log=classpath:db.changelogs/app-center-changelog-1.0.0.xml
meeds.cache.app-center.application.ttl=-1
meeds.cache.app-center.application.max=1000

# Badge counts are derived, never stored. The TTL bounds staleness for a source
# whose changes the platform cannot observe, self-heals a missed eviction, and
# bounds how long a cluster node that missed one serves a stale value.
# Value in seconds; read once at cache creation.
meeds.cache.app-center.badge.ttl=300
# Sized as concurrent users x badged applications
meeds.cache.app-center.badge.max=5000

# Portlet instance id -> content id mapping, used to bind a PORTLET application
# to the badge plugin declaring that portlet. Cached as a single entry because
# it is read for every application of every launcher render.
meeds.cache.app-center.badge.portlet.ttl=300
meeds.cache.app-center.badge.portlet.max=10

# Time budget of a single plugin count, in milliseconds. Badges render on the
# topbar of every page: a source that does not answer within it degrades to
# "no badge" instead of holding the request.
appcenter.badge.count.timeout=2000
# Consecutive failures after which a plugin stops being called at all, and for
# how long. Protects the counting threads from a source that hangs on every call.
appcenter.badge.count.breaker.failureThreshold=3
appcenter.badge.count.breaker.openSeconds=60
# Threads serving badge counts concurrently
appcenter.badge.count.threads=10
